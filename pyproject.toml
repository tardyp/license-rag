[project]
name = "license-rag"
version = "0.1.0"
description = "Identify the SPDX license of arbitrary license text, with a calibrated pertinence level, from a single-file SQLite database built out of the ScanCode LicenseDB corpus"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Pierre Tardy", email = "pierre.tardy@renault.com" }]
keywords = ["license", "licenses", "spdx", "compliance", "sbom", "identification"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
dependencies = [
    "model2vec>=0.5.0",
    "numpy>=1.26",
]

[project.scripts]
license-rag = "license_rag.cli:main"
license-rag-corpus = "license_rag.sources:main"

[project.urls]
Homepage = "https://github.com/tardyp/license-rag"
Repository = "https://github.com/tardyp/license-rag"
Issues = "https://github.com/tardyp/license-rag/issues"
"ScanCode LicenseDB" = "https://github.com/aboutcode-org/scancode-licensedb"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/license_rag"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
# Long lines are a documentation choice in this codebase: the score formulas,
# level tables and corpus constants read better on one line.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
